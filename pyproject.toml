[project]
name = "snap-bak"
version = "0.1.0"
description = "Btrfs Snapshot -> Restic Backup Orchestrator"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0", "python-dateutil>=2.0"]

[project.scripts]
snap-bak = "scripts.snapbak:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
