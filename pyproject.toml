[project]
name = "snap-bak"
version = "0.1.0"
description = "Btrfs Snapshot -> Restic Backup Orchestrator"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0", "python-dateutil>=2.0", "json5>=0.9"]

[project.scripts]
snap-bak = "snap_bak.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["snap_bak"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
tmp_path_retention_policy = "none"

[tool.pyright]
venvPath = "."
venv = ".venv"
