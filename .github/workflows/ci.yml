name: CI

# Change-triggered only: no schedules. The Actions tab can run it by hand too.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Pinned rather than a dependency: the lint result must not depend on
      # which interpreter environment happened to install it.
      - run: uvx ruff@0.16.9 check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      # The suite skips its restic integration tests when the binary is
      # absent, so a missing binary would let a broken walker pass.
      #
      # Deliberately the NEWEST release, not a pin: restic's own behaviour is
      # what we port, so a restic change must surface here as a failing test
      # and be fixed in our code. Pinning an old binary would hide the
      # divergence until a user hit it with their own restic.
      - name: Install the latest restic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/restic/restic/releases/latest --jq .tag_name)
          echo "Installing restic $tag"
          curl -fsSL -o /tmp/restic.bz2 \
            "https://github.com/restic/restic/releases/download/${tag}/restic_${tag#v}_linux_amd64.bz2"
          bunzip2 /tmp/restic.bz2
          sudo install -m 0755 /tmp/restic /usr/local/bin/restic
          restic version
      - run: uv sync --locked
      - run: uv run pytest -q
